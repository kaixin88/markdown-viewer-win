<!doctype html>
<html lang="zh-CN" data-theme="warm">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>文件查看器</title>
<style>*{box-sizing:border-box}
  html{background:#FAF9F6}
  html,body{margin:0;height:100%}
  body{font-family:"Segoe UI","Microsoft YaHei UI","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC",sans-serif;font-size:16px;line-height:1.75;-ms-text-size-adjust:100%;background:#FAF9F6;color:#1E293B}

  /* ===== 顶部状态条（只显示文件名/保存提示，按钮在 WinForms 菜单栏） ===== */
  #bar{position:fixed;top:0;left:0;right:0;height:32px;z-index:10;border-bottom:1px solid #B9C4DC;padding:6px 12px;overflow:hidden;background:#F0EEE8}
  #bar .meta{float:left;line-height:20px;font-size:13px;max-width:85%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;color:#4A5568}
  #bar .status{float:right;line-height:20px;opacity:0;transition:opacity .3s;color:#2a8;font-size:13px}

  #view{margin-top:32px;padding:22px 22px 90px;max-width:1000px}
  #edit{display:none;margin-top:32px;width:100%;height:calc(100% - 32px);border:0;resize:none;padding:18px 22px;font-family:Consolas,"Lucida Console","Courier New","Microsoft YaHei",monospace;font-size:14.5px;line-height:1.75;outline:none}

  /* ===== Markdown 排版 ===== */
  .md h1,.md h2,.md h3,.md h4{margin:24px 0 16px;font-weight:600;line-height:1.3}
  .md h1{padding-bottom:.3em;border-bottom:1px solid #ddd;font-size:1.9em}
  .md h2{padding-bottom:.3em;border-bottom:1px solid #ddd;font-size:1.5em}
  .md h3{font-size:1.25em}
  .md p{margin:0 0 16px}
  .md a{text-decoration:none}
  .md a:hover{text-decoration:underline}
  .md code{border-radius:5px;padding:.2em .45em;font-size:86%;font-family:Consolas,"Lucida Console",monospace}
  .md pre{border-radius:8px;padding:16px;overflow:auto;border:1px solid}
  .md pre code{background:none;padding:0;font-size:92%}
  .md blockquote{margin:0 0 16px;padding:0 1em;border-left:4px solid #ddd}
  .md table{border-collapse:collapse;margin:0 0 16px}
  .md th,.md td{border:1px solid #ddd;padding:6px 13px}
  .md img{max-width:100%}
  .md hr{border:0;border-top:1px solid #ddd;margin:24px 0}
  .md ul,.md ol{padding-left:2em;margin:0 0 16px}
  .md kbd{border:1px solid #ccc;border-radius:4px;padding:1px 6px;font-size:12px}

  /* ===== 代码/文本视图 ===== */
  .codebox{border-collapse:collapse;width:100%}
  .codebox td{padding:0;vertical-align:top}
  .gutter{padding:14px 10px 14px 14px;text-align:right;-ms-user-select:none;user-select:none;white-space:pre;font-family:Consolas,"Lucida Console",monospace;font-size:14px;line-height:1.75;border-right:1px solid}
  .codebox .code{padding:14px 16px;white-space:pre;font-family:Consolas,"Lucida Console",monospace;font-size:14px;line-height:1.75;overflow:auto}
  .codebox .code pre{margin:0}
  .cmt{font-style:italic}
  .kw{font-weight:600}

  #empty{max-width:860px;margin:14vh auto;text-align:center;color:#4A5568}
  #empty h1{font-size:20px;font-weight:600}

  /* ===== 配色面板 ===== */
  #palette{display:none;position:fixed;top:32px;right:12px;z-index:30;border:1px solid #ccc;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.15);padding:12px;width:262px;font-size:13px;background:#fff;color:#333}
  #palette .ptitle{font-weight:600;margin-bottom:8px}
  #palette #swatches{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  #palette .psec{border-top:1px solid #ddd;padding-top:10px}
  #palette .prow{margin-top:8px;line-height:2}
  #palette input{width:84px;border:1px solid #bbb;border-radius:4px;padding:2px 4px;font-family:Consolas,monospace;background:#fff;color:#333}
  #palette #customPreview{display:inline-block;width:22px;height:22px;border:1px solid;vertical-align:middle;border-radius:4px}
  #palette #customMsg{margin-top:6px;color:#c33;min-height:14px}
</style>
</head>
<body>
<div id="bar">
  <span class="meta" id="meta"></span>
  <span class="status" id="status"></span>
</div>
<div id="view"></div>
<textarea id="edit" spellcheck="false"></textarea>
<div id="palette">
  <div class="ptitle" id="ptitle">阅读配色（点击色块即可切换）</div>
  <div id="swatches"></div>
  <div class="psec">自定义颜色（输入后即时生效）</div>
  <div class="prow">
    背景 <input id="customBg" type="text" value="#FAF9F6">
    文字 <input id="customFg" type="text" value="#1A1A1A">
  </div>
  <div class="prow">
    <span id="customPreview"></span>
    <button class="btn" id="applyCustom">应用</button>
    <button class="btn" id="closePalette">关闭</button>
  </div>
  <div id="customMsg"></div>

    bluegray:{name:'蓝调浅灰',  bg:'#EDEFF2', fg:'#1F2937', bar:'#E1E4EA', border:'#CDD2DB', code:'#E4E7ED', gutter:'#DCE0E7', muted:'#4A5568', link:'#1E4E8C', str:'#1F6F3F', cmt:'#5C6B80', kw:'#7A2E10', num:'#8A4D10', tag:'#1A5A7A'},
    green:   {name:'绿豆沙',    bg:'#C7EDCC', fg:'#153820', bar:'#B9E2BF', border:'#8FCB99', code:'#BCE3C2', gutter:'#B2DDB8', muted:'#3D5B47', link:'#1B6B36', str:'#1F6F3F', cmt:'#5A7A66', kw:'#7A2E10', num:'#8A4D10', tag:'#1A5A7A'},
    grass:   {name:'青草绿',    bg:'#E3EDCD', fg:'#243018', bar:'#D6E2BC', border:'#B8C89B', code:'#DAE3C6', gutter:'#CFDBB4', muted:'#4E5C40', link:'#2F5F22', str:'#1F6F3F', cmt:'#5F6F52', kw:'#7A2E10', num:'#8A4D10', tag:'#1A5A7A'},
    purple:  {name:'葛巾紫',    bg:'#E9EBFE', fg:'#222044', bar:'#DCDFF4', border:'#C0C5F0', code:'#DDDFF4', gutter:'#D3D7EF', muted:'#55527A', link:'#3F3590', str:'#1F6F3F', cmt:'#6F6C99', kw:'#6A205E', num:'#8A4D10', tag:'#1A5A7A'},
    warm:    {name:'暖白',      bg:'#FAF9F6', fg:'#1A1A1A', bar:'#F0EEE8', border:'#DDDAD0', code:'#F1EFE9', gutter:'#ECEAE3', muted:'#5E5B52', link:'#0751B6', str:'#0A6B24', cmt:'#6A6A60', kw:'#8F3812', num:'#7A3A08', tag:'#0E5A26'},
    white:   {name:'纯白',      bg:'#FFFFFF', fg:'#1F2328', bar:'#F6F8FA', border:'#D0D7DE', code:'#F6F8FA', gutter:'#EEF1F4', muted:'#4F5760', link:'#0969DA', str:'#0A6B24', cmt:'#5C656E', kw:'#0850C1', num:'#7A3A08', tag:'#0E5A26'},
    night:   {name:'夜间',      bg:'#1E2124', fg:'#E6EAEF', bar:'#26292D', border:'#3A4048', code:'#272B30', gutter:'#22262A', muted:'#9BA5B0', link:'#79B8FF', str:'#7EE787', cmt:'#9BA5B0', kw:'#79C0FF', num:'#F0883E', tag:'#7EE787'}
  };
  var THEME_ORDER = ['sea','gray','bluegray','green','grass','purple','warm','white','night'];
  var DEFAULT_THEME = 'warm';

  function hexToRgb(h){ h=h.replace('#',''); if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2]; return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)]; }
  function rgbToHex(a){ return '#'+a.map(function(x){ var v=Math.max(0,Math.min(255,Math.round(x))).toString(16); return v.length<2?'0'+v:v; }).join(''); }
  function mix(a,b,t){ var A=hexToRgb(a),B=hexToRgb(b); return rgbToHex([A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t]); }
  function isDark(h){ var c=hexToRgb(h); return (0.299*c[0]+0.587*c[1]+0.114*c[2])<140; }
  function normHex(h){ if(!h) return ''; h=String(h).trim(); if(h[0]!=='#') h='#'+h; if(/^#[0-9a-fA-F]{3}$/.test(h)){ h='#'+h[1]+h[1]+h[2]+h[2]+h[3]+h[3]; } if(/^#[0-9a-fA-F]{6}$/.test(h)) return h.toLowerCase(); return ''; }

  function derivePalette(bg,fg){
    var dark=isDark(bg);
    var muted=mix(fg,bg,0.45);
    var p = {
      name:'自定义', bg:bg, fg:fg,
      bar:mix(bg,fg,0.06), border:mix(fg,bg,0.28),
      code: dark?mix(bg,'#ffffff',0.08):mix(bg,'#000000',0.05),
      gutter: dark?mix(bg,'#ffffff',0.05):mix(bg,'#000000',0.03),
      muted:muted,
      link:dark?'#79B8FF':'#15579A',
      str:dark?'#7EE787':'#1F6F3F',
      cmt:muted,
      kw:dark?'#79C0FF':'#8F3812',
      num:dark?'#F0883E':'#7A4A0A',
      tag:dark?'#7EE787':'#1A5A7A'
    };
    return p;
  }

  function buildCSS(p){
    var s = [];
    function r(sel, decl){ s.push(sel+'{'+decl+'}'); }
    r('body','background:'+p.bg+';color:'+p.fg);
    r('html','background:'+p.bg);
    r('#bar','background:'+p.bar+';border-color:'+p.border);
    r('#bar .btn','background:'+p.bg+';border-color:'+p.border+';color:'+p.fg);
    r('#bar .meta','color:'+p.muted);
    r('#bar .status','color:'+(isDark(p.bg)?'#3fb950':'#2a8'));
    r('#palette','background:'+p.bg+';color:'+p.fg+';border-color:'+p.border);
    r('#palette .psec','border-color:'+p.border);
    r('#palette input','background:'+p.bg+';color:'+p.fg+';border-color:'+p.border);
    r('#palette #customPreview','border-color:'+p.border);
    r('.md a','color:'+p.link);
    r('.md code,.md pre','background:'+p.code);
    r('.md pre','border-color:'+p.border);
    r('.md h1,.md h2','border-color:'+p.border);
    r('.md blockquote','border-color:'+p.border+';color:'+p.muted);
    r('.md th,.md td','border-color:'+p.border);
    r('.md hr','border-color:'+p.border);
    r('.md kbd','background:'+p.code+';border-color:'+p.border);
    r('#edit','background:'+p.bg+';color:'+p.fg);
    r('.codebox .code','background:'+p.code);
    r('.codebox .gutter','background:'+p.gutter+';border-color:'+p.border+';color:'+p.muted);
    r('#empty','color:'+p.muted);
    r('.str','color:'+p.str);
    r('.cmt','color:'+p.cmt);
    r('.kw','color:'+p.kw);
    r('.num','color:'+p.num);
    r('.tag','color:'+p.tag);
    return s.join('\n');
  }

  function setStyleCss(st, css){
    try{
      if(st.styleSheet){ st.styleSheet.cssText = css; }
      else { st.innerHTML = css; }
    }catch(e){}
  }

  function injectTheme(key){
    var p = PALETTES[key] || PALETTES[DEFAULT_THEME];
    var css = buildCSS(p);
    var st = document.getElementById('theme');
    if(!st){
      st = document.createElement('style');
      st.id = 'theme';
      var head = document.getElementsByTagName('head')[0];
      if(head) head.appendChild(st);
    }
    setStyleCss(st, css);
    document.documentElement.setAttribute('data-theme', key);
  }

  function persist(o){ try{ if(window.external && window.external.saveSettings){ window.external.saveSettings(JSON.stringify(o)); } }catch(e){} }

  function safeStyle(el, prop, val){ try{ if(el && el.style) el.style[prop]=val; }catch(e){} }

  function markActive(key){
    var box=document.getElementById('swatches'); if(!box) return;
    var nodes=box.childNodes;
    for(var i=0;i<nodes.length;i++){
      var n=nodes[i];
      if(!n || !n.getAttribute) continue;
      var k=null;
      try{ k=n.getAttribute('data-key'); }catch(e){ k=null; }
      if(!k) continue;
      var on=(k===key);
      safeStyle(n,'border', on?'2px solid #0969da':'1px solid #bbb');
      safeStyle(n,'outline', on?'2px solid #0969da':'none');
      safeStyle(n,'boxShadow', on?'0 0 0 2px rgba(9,105,218,.45)':'none');
    }
  }

  function updateThemeUI(){
    var key = document.documentElement.getAttribute('data-theme') || DEFAULT_THEME;
    var p = (key==='custom' && PALETTES['custom']) ? PALETTES['custom'] : PALETTES[key];
    var label = (p && p.name) ? p.name : '默认';
    // ★ 先同步自定义输入框与预览（这一步必须最先做：IE 下后面的样式写入可能抛错）
    var cb=document.getElementById('customBg'), cf=document.getElementById('customFg'), pv=document.getElementById('customPreview');
    if(p){ if(cb) cb.value=p.bg; if(cf) cf.value=p.fg; if(pv) safeStyle(pv,'background',p.bg); }
    var b=document.getElementById('themeBtn'); if(b) b.innerText='配色：'+label;
    var t=document.getElementById('ptitle'); if(t) t.innerText='阅读配色（当前：'+label+'，点击色块即可切换）';
    try{ if(window.external && window.external.setThemeName) window.external.setThemeName(label); }catch(e){}
    markActive(key);
  }

  function setTheme(key){
    if(!PALETTES[key]) key = DEFAULT_THEME;
    injectTheme(key);
    var p = PALETTES[key];
    persist(key==='custom' ? {mode:'custom', bg:p.bg, fg:p.fg} : {mode:'preset', key:key});
    updateThemeUI();
  }

  // 应用自定义配色：内联写 body/html（最高优先级）→ 注入主题 → 读回校验，失败则重写样式表
  function applyCustom(bg, fg){
    bg = normHex(bg); fg = normHex(fg);
    if(!bg || !fg) return false;
    PALETTES['custom'] = derivePalette(bg, fg);
    PALETTES['custom'].bg = bg;   // 记忆值始终等于用户输入
    PALETTES['custom'].fg = fg;
    try{
      document.body.style.backgroundColor = bg;
      document.body.style.color = fg;
      document.documentElement.style.backgroundColor = bg;
    }catch(e){}
    setTheme('custom');
    // 读回校验：确认背景色真的生效，不生效就再直接写一次样式表
    try{
      var want = 'rgb(' + hexToRgb(bg).join(', ') + ')';
      var actual = getComputedStyle(document.body).backgroundColor;
      if(actual !== want){
        var st = document.getElementById('theme');
        if(st && st.styleSheet){ st.styleSheet.cssText = buildCSS(PALETTES['custom']); }
        actual = getComputedStyle(document.body).backgroundColor;
      }
      flash('配色已应用：' + bg + ' / ' + fg);
    }catch(e){}
    return true;
  }

  function cycleTheme(){ var i=THEME_ORDER.indexOf(document.documentElement.getAttribute('data-theme')); if(i<0)i=0; setTheme(THEME_ORDER[(i+1)%THEME_ORDER.length]); }

  function buildSwatches(){
    var box=document.getElementById('swatches'); if(!box) return;
    for(var i=0;i<THEME_ORDER.length;i++){
      (function(k){
        var p=PALETTES[k];
        var el=document.createElement('div');
        el.setAttribute('data-key',k);
        el.title=p.name;
        el.style.cssText='width:46px;height:34px;border-radius:6px;border:1px solid #bbb;cursor:pointer;position:relative;overflow:hidden';
        el.innerHTML='<div style="position:absolute;inset:0;background:'+p.bg+'"></div><div style="position:absolute;left:5px;bottom:1px;font-size:10px;line-height:1.2;color:'+p.fg+';">'+p.name+'</div>';
        el.onclick=function(){ setTheme(k); };
        box.appendChild(el);
      })(THEME_ORDER[i]);
    }
  }

  function initTheme(s){
    if(s && s.mode==='custom' && s.bg && s.fg){
      PALETTES['custom'] = derivePalette(s.bg, s.fg);
      setTheme('custom');
    } else {
      setTheme(s && s.key && PALETTES[s.key] ? s.key : DEFAULT_THEME);
    }
  }

  /* ===== Markdown 预处理与后处理 ===== */
  function mdPreproc(src){
    // 将 @image#1:Clipboard_Screenshot.png 转成标准 Markdown 图片
    src = src.replace(/@image#(\d+):([^\s)\]\>]+)/g, function(m,n,file){ return '!['+file+']('+file+')'; });
    return src;
  }
  function mdPostproc(html){
    try{
      var div = document.createElement('div');
      div.innerHTML = html;
      var codes = div.getElementsByTagName('code');
      for(var i=0;i<codes.length;i++){
        var code = codes[i];
        var cls = code.className || '';
        var m = cls.match(/lang-(\w+)/) || cls.match(/language-(\w+)/);
        if(m){
          var lang = m[1].toLowerCase();
          var text = code.innerText || code.textContent || '';
          code.innerHTML = highlight(text, lang);
        }
      }
      return div.innerHTML;
    }catch(e){ return html; }
  }

  /* ===== 渲染 ===== */
  function renderPlainText(text){
    var lines = text.split('\n').length, gut='';
    for(var i=1;i<=lines;i++){ gut += i + (i<lines?'\n':''); }
    return '<table class="codebox"><tr><td class="gutter">'+esc(gut)+'</td><td class="code"><pre><code>'+esc(text)+'</code></pre></td></tr></table>';
  }

  var editingNow=false, canSaveNow=false;
  function render(){
    var view=document.getElementById('view');
    var ta=document.getElementById('edit');
    editingNow=false; canSaveNow=false; notifyState();
    ta.style.display='none';
    view.style.display='block';
    if(!content){
      view.innerHTML='<div id="empty"><h1>轻量离线文件查看器</h1><p>用窗口左上角菜单「文件 → 打开」选择文件。</p><p>支持 Markdown 与代码文件（.txt/.sql/.py 等），可编辑并保存。</p></div>';
      return;
    }
    if(isMd){
      var md = mdPreproc(content);
      var html = '';
      try { html = marked(md); } catch(e){ html = '<p>渲染错误：'+esc(e.message)+'</p>'; }
      html = mdPostproc(html);
      view.innerHTML = '<div class="md">'+html+'</div>';
    } else if(ext==='txt' || ext==='text' || ext==='log'){
      view.innerHTML = renderPlainText(content);
    } else {
      var lang = LANG_BY_EXT[ext] ? ext : '_text';
      var html = highlight(content, lang);
      var lines = content.split('\n').length, gut='';
      for(var i=1;i<=lines;i++){ gut += i + (i<lines?'\n':''); }
      view.innerHTML = '<table class="codebox"><tr><td class="gutter">'+esc(gut)+'</td><td class="code"><pre><code>'+html+'</code></pre></td></tr></table>';
    }
  }

  function enterEdit(){
    if(!content) return;
    var ta=document.getElementById('edit');
    ta.value=content;
    document.getElementById('view').style.display='none';
    ta.style.display='block';
    editingNow=true; canSaveNow=true; notifyState();
    ta.focus();
  }
  function cancelEdit(){
    var ta=document.getElementById('edit');
    ta.style.display='none';
    document.getElementById('view').style.display='block';
    editingNow=false; canSaveNow=false; notifyState();
  }
  // 强制回到阅读态：极简、不依赖渲染成功，保存后任何情况都退出编辑
  function ensureViewMode(){
    var ta=document.getElementById('edit');
    if(ta){ ta.style.display='none'; }
    var view=document.getElementById('view');
    if(view){ view.style.display='block'; }
    editingNow=false; canSaveNow=false; notifyState();
    notifyLog('ensureViewMode 完成: edit.display=' + (ta?ta.style.display:'?') + ', view.display=' + (view?view.style.display:'?'));
  }
  function save(){
    var ta=document.getElementById('edit');
    if(editingNow && ta) content=ta.value;   // 编辑中一律以编辑框当前内容为准（含清空文件的情况）
    notifyLog('页面 save() 执行，内容长度=' + (content||'').length);
    if(window.external && window.external.saveFile){
      try{ window.external.saveFile(content); }
      catch(e){ flash('保存失败：'+(e.message||e)); return; }
    }
    ensureViewMode();
    flash('已保存');
    try{ render(); }catch(e){ /* 渲染失败也不影响已保存的结果 */ }
  }
  // saved：C# 写入磁盘的内容（由 C# 传入）。传了就以此为准刷新页面内容与视图，
  // 否则页面仍会按旧的 content 变量渲染 —— 这正是"保存后看到的还是老内容"的原因。
  function afterSave(saved){
    if(typeof saved === 'string') content = saved;
    ensureViewMode();
    flash('已保存');
    try{ render(); }catch(e){}
  }
  function afterSaveContent(saved){ afterSave(saved); }
  // C# 侧保存完成后触发（无参）。直接从编辑框取最新内容刷新渲染，
  // 不依赖跨语言传参 —— IE 下 InvokeScript 传长字符串不可靠。
  function afterSaveFromEdit(){
    try{
      var ta=document.getElementById('edit');
      if(ta && typeof ta.value==='string') content=ta.value;
    }catch(e){}
    ensureViewMode();
    flash('已保存');
    try{ render(); }catch(e){}
  }
  function flash(msg){
    var s=document.getElementById('status');
    if(s){ s.innerText=msg; s.style.opacity=1; setTimeout(function(){ s.style.opacity=0; },1600); }
  }

  // 诊断通道：把页面侧的关键事件写到 C# 日志（%TEMP%\mdviewer.log），
  // 用来判断 Ctrl+S 到底是"被 C# 接走"还是"到了网页"。
  function notifyLog(msg){
    try{ if(window.external && window.external.log) window.external.log(String(msg)); }catch(e){}
  }
  function notifyState(){
    try{ if(window.external && window.external.setEditState){ window.external.setEditState(editingNow, canSaveNow); } }catch(e){}
  }
  function notifyName(){
    try{ if(window.external && window.external.setFileName){ window.external.setFileName(name); } }catch(e){}
  }
  function togglePalette(){
    var p=document.getElementById('palette');
    if(!p) return;
    p.style.display=(p.style.display==='block')?'none':'block';
  }
  window.enterEdit=enterEdit; window.cancelEdit=cancelEdit; window.save=save; window.afterSave=afterSave; window.afterSaveContent=afterSaveContent; window.afterSaveFromEdit=afterSaveFromEdit; window.ensureViewMode=ensureViewMode; window.togglePalette=togglePalette; window.cycleTheme=cycleTheme; window.applyCustom=applyCustom; window.setTheme=setTheme;

  window.onload=function(){
    // 每一步独立防错：任何一步异常都不能影响后续初始化（IE 下尤其重要）
    function step(fn){ try{ fn(); }catch(e){ try{ flash('初始化警告：'+(e.message||e)); }catch(e2){} } }

    step(function(){
      var raw = (typeof SETSB64!=='undefined' && SETSB64) ? deb64(SETSB64) : '';
      var settings = {};
      try{ if(raw) settings = JSON.parse(raw); }catch(e){ settings={}; }
      initTheme(settings);
    });

    step(function(){
      var meta=document.getElementById('meta');
      if(meta) meta.innerText = name + (isMd?'  ·  Markdown' : ((LANG_BY_EXT[ext] && LANG_BY_EXT[ext]!=='_text')?('  ·  '+ext.toUpperCase()+' 代码'):'  ·  文本'));
    });

    step(function(){ render(); });

    step(function(){
      var closeP=document.getElementById('closePalette');
      if(closeP) closeP.onclick=function(){ document.getElementById('palette').style.display='none'; };
    });

    step(function(){
      var applyC=document.getElementById('applyCustom');
      if(applyC) applyC.onclick=function(){
        var bg=document.getElementById('customBg').value, fg=document.getElementById('customFg').value;
        var msg=document.getElementById('customMsg');
        if(!normHex(bg) || !normHex(fg)){ if(msg) msg.innerText='请输入 6 位十六进制颜色，如 #DCE2F1'; return; }
        if(msg) msg.innerText='';
        if(applyCustom(bg, fg)){ document.getElementById('palette').style.display='none'; }
      };
    });

    step(function(){
      var bgInput=document.getElementById('customBg'), fgInput=document.getElementById('customFg');
      function liveApply(){
        var pv=document.getElementById('customPreview');
        var b=normHex(bgInput.value), f=normHex(fgInput.value);
        if(pv && b) safeStyle(pv,'background',b);
        var msg=document.getElementById('customMsg');
        if(b && f){ if(msg) msg.innerText=''; applyCustom(b, f); }
        else if(msg){ msg.innerText='颜色格式：#RRGGBB'; }
      }
      if(bgInput){ bgInput.onkeyup=liveApply; bgInput.onchange=liveApply; bgInput.onblur=liveApply; }
      if(fgInput){ fgInput.onkeyup=liveApply; fgInput.onchange=liveApply; fgInput.onblur=liveApply; }
    });

    step(function(){
      var ta=document.getElementById('edit');
      // 诊断（只在按住 Ctrl 时记录，正常打字不写日志）：
      // 用来区分"按键被 IE 加速键吃掉（这里不会有记录）"和"按键到了编辑框但没人处理"。
      ta.onkeydown=function(e){
        var k=e.keyCode||0;
        if(e.ctrlKey||e.metaKey) notifyLog('textarea onkeydown Ctrl+keyCode='+k);
        if((e.ctrlKey||e.metaKey) && (e.key==='s'||k===83)){
          notifyLog('textarea 捕获 Ctrl+S -> 走页面 save()');
          if(e.preventDefault) e.preventDefault(); else e.returnValue=false;
          save();
        }
      };
      document.onkeydown=function(e){
        if((e.ctrlKey||e.metaKey) && (e.keyCode||0)!==83) notifyLog('document onkeydown Ctrl+keyCode='+(e.keyCode||0));
      };
    });

    step(function(){ notifyName(); });
  };

  buildSwatches();
})();
</script>
</body>
