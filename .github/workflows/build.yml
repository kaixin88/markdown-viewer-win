name: Build Windows exe

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build (net48, x64)
        run: dotnet build MarkdownViewer/MarkdownViewer.csproj -c Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarkdownViewer-exe
          path: MarkdownViewer/bin/Release/net48/MarkdownViewer.exe

      - name: Release (upsert latest)
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: 最新构建
          allowUpdates: true
          replacesArtifacts: true
          prerelease: false
          artifacts: MarkdownViewer/bin/Release/net48/MarkdownViewer.exe
