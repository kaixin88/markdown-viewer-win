name: Build Windows exe

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build net48 (MSBuild)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find "MSBuild\Current\Bin\MSBuild.exe"
          if (-not (Test-Path $msbuild)) {
            $msbuild = & $vswhere -latest -find "MSBuild\**\Bin\MSBuild.exe"
          }
          Write-Host "MSBuild: $msbuild"
          & $msbuild "${{ github.workspace }}\MarkdownViewer\MarkdownViewer.csproj" /t:Restore
          & $msbuild "${{ github.workspace }}\MarkdownViewer\MarkdownViewer.csproj" /p:Configuration=Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarkdownViewer-exe
          path: MarkdownViewer/bin/Release/net48/MarkdownViewer.exe

      - name: Release (upsert latest)
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: latest build
          allowUpdates: true
          replacesArtifacts: true
          prerelease: false
          artifacts: MarkdownViewer/bin/Release/net48/MarkdownViewer.exe
